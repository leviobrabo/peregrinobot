name: Refresh Telegram v1 lockfile

on:
  push:
    branches:
      - fix/telegram-v1-safe-upgrade-20261118
    paths:
      - '.github/workflows/refresh-telegram-lock.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-v1-safe-upgrade-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile and repair lockfile
        run: |
          npm install --package-lock-only --no-audit --no-fund
          # npm audit fix exits 1 if unfixable moderate dev-only findings remain.
          # The subsequent production audit still fails for any high/critical issue.
          npm audit fix --package-lock-only --no-fund || true
      - name: Validate reproducible install and tests
        run: |
          npm ci --no-fund
          npm test -- --runInBand
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile only if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate audited npm lockfile for Telegram v1"
          git push origin HEAD:fix/telegram-v1-safe-upgrade-20261118
